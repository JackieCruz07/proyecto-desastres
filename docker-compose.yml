services:
  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    image: atlas-desastres:latest
    container_name: atlas-desastres
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
