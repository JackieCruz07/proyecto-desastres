server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compresión de texto, datos y librerías.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        image/svg+xml;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GeoJSON con su tipo MIME correcto para que fetch lo interprete.
    location ~* \.geojson$ {
        default_type application/geo+json;
    }

    # Archivos estáticos: caché de una semana.
    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Datos: caché corta para reflejar regeneraciones del pipeline.
    location ~* \.(?:json)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Navegación de la aplicación de una sola página.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
